name: update-flake-lock
# Wöchentlich: Lock bumpen, alle Hosts bauen, bei grünem Build direkt auf main pushen.
# Kein PR → kein PAT nötig (GITHUB_TOKEN-PRs triggern keine CI). Roter Build = kein Push.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 5" # freitags 03:00 UTC
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Update flake.lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          nix flake update --commit-lock-file
      - name: Build all hosts
        run: nix build .#buildAll -L
      - name: Push
        run: git push origin HEAD:main
